<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cd player</title>
<style>
  :root{
    --bg:#f1f1ef; --ink:#161616; --muted:#8a8a86; --line:#d9d9d5;
    --cd:150px; --case:170px;
    --player:min(86vw,380px);
    --accent:#ff9f1c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 64px;gap:22px;overflow-x:hidden}

  h1{font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
  #status{font-size:12px;min-height:1.4em;text-align:center;letter-spacing:.04em}

  /* ---------- PLAYER ---------- */
  .player{
    width:var(--player);aspect-ratio:1;border-radius:50%;position:relative;flex:none;
    background:radial-gradient(circle at 30% 25%, #fdfdfd 0%, #e4e5e7 38%, #c4c6c9 100%);
    box-shadow:0 0 0 5px #111, 0 0 0 6px #444, 0 18px 30px -8px rgba(0,0,0,.35),
      inset 0 2px 6px rgba(255,255,255,.9), inset 0 -8px 14px rgba(0,0,0,.12);
  }
  .player .brand{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.3em;color:#7b7d80;text-transform:uppercase;white-space:nowrap}
  .lid-p{
    position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f7f7f8, #d3d5d8 70%, #bfc2c6);
    box-shadow:0 0 0 3px #f4f4f5, 0 0 0 5px #a9acb0, inset 0 -4px 8px rgba(0,0,0,.12);
    display:grid;place-items:center;transition:box-shadow .15s;
  }
  .lid-p.hot{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--accent), 0 0 24px 4px rgba(255,159,28,.45)}
  .lid-p .glyph{position:relative;z-index:25;font-size:22px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .2s}
  .lid-p.has .glyph{opacity:.95}
  .lid-p.has{cursor:pointer}
  .lid-p .hint{position:absolute;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#85878b;
    text-align:center;line-height:1.5;pointer-events:none;transition:opacity .2s}
  .lid-p.has .hint{opacity:0}

  /* ---------- CD ---------- */
  .cd{
    width:var(--cd);height:var(--cd);border-radius:50%;
    position:absolute;left:50%;top:50%;margin:calc(var(--cd) / -2) 0 0 calc(var(--cd) / -2); /* sits centred in a tray */
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));outline:none;
  }
  .cd:focus-visible{box-shadow:0 0 0 3px var(--accent)}
  .cd.dragging{cursor:grabbing;z-index:1000;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35))}
  .cd.loaded{z-index:20}
  .cd.glide{transition:left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1)}
  .disc{
    position:absolute;inset:0;border-radius:50%;
    background:
      conic-gradient(from 0deg,
        #fff 0deg, #f4d3ea 28deg, #e8c4cf 50deg, #b78a7a 78deg, #b0907e 105deg, #c0a0b8 130deg,
        #9f7fb0 155deg, #9fb2de 185deg, #b5e8d6 215deg, #fff 250deg,
        #a9e2bb 275deg, #6fae93 300deg, #7a7fb0 325deg, #d8c9de 345deg, #fff 360deg);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18), inset 0 0 18px rgba(255,255,255,.5);
    filter:hue-rotate(var(--hue,0deg));
  }
  .disc::before{
    content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,#f3f4f5 0 45%, #cfd3d6 46% 70%, #8d9396 72% 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.2);
  }
  .disc::after{
    content:"";position:absolute;left:50%;top:50%;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
  }
  .tray .cd .disc::after{background:#4a4a4a}
  .cd.loaded .disc::after{background:#dfe1e3}
  .cd.has-art .disc{
    filter:none;
    background:
      conic-gradient(from 20deg,
        rgba(255,255,255,.55) 0deg, rgba(255,255,255,0) 40deg,
        rgba(255,255,255,.25) 110deg, rgba(255,255,255,0) 160deg,
        rgba(255,255,255,.55) 200deg, rgba(255,255,255,0) 250deg,
        rgba(255,255,255,.3) 310deg, rgba(255,255,255,.55) 360deg),
      var(--art) center/cover no-repeat;
  }
  .cd.has-art .disc::before{
    background:radial-gradient(circle,rgba(243,244,245,.75) 0 45%, rgba(207,211,214,.8) 46% 70%, rgba(141,147,150,.85) 72% 100%);
  }
  .cd.spinning .disc{animation:spin 2.4s linear infinite}
  .cd.spinning.paused .disc{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- JEWEL CASES ---------- */
  .shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:30px 34px;max-width:820px;margin-top:8px}
  .slot{display:flex;flex-direction:column;align-items:center;gap:12px;width:var(--case);position:relative}
  .slot.open{z-index:30}
  .anchor{width:var(--case);height:var(--case);position:relative}
  .jewel{position:absolute;inset:0;perspective:1100px;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .jewel.open{transform:translateX(50%)}

  .tray{position:absolute;inset:0;z-index:1;border-radius:3px;
    background:linear-gradient(145deg,#2c2c2e,#161617);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 14px 22px -8px rgba(0,0,0,.45);}
  .tray::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--cd) + 12px);height:calc(var(--cd) + 12px);
    transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.1);
    background:radial-gradient(circle,rgba(255,255,255,.04),rgba(255,255,255,0) 70%)}
  .tray::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;
    background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,0));pointer-events:none}

  .lid{position:absolute;inset:0;z-index:5;transform-origin:0 50%;transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none}
  .jewel.open .lid{transform:rotateY(-165deg)}
  .lid:focus-visible .front{box-shadow:0 0 0 3px var(--accent)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden}
  .front{
    background:var(--cover) center/cover no-repeat, #ddd;
    box-shadow:0 0 0 1px rgba(0,0,0,.3), 0 14px 22px -8px rgba(0,0,0,.45);
  }
  .front.plain{background:hsl(var(--h,0) 30% 86%);display:grid;place-items:center;text-align:center;
    font-size:12px;letter-spacing:.08em;line-height:1.6;padding:0 14%}
  .front.plain small{display:block;color:rgba(0,0,0,.5);font-size:10px}
  .front .spine{position:absolute;left:0;top:0;bottom:0;width:7%;
    background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.12));border-right:1px solid rgba(255,255,255,.35)}
  .front::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 62%,rgba(255,255,255,.22) 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
  .back{transform:rotateY(180deg);background:#e9eaeb;
    box-shadow:0 0 0 1px rgba(0,0,0,.2), inset 0 0 0 6px #f6f6f6;padding:16px 14px 12px 14px;
    font-size:9px;line-height:1.7;color:#444;letter-spacing:.04em}
  .back b{display:block;font-weight:600;color:#111;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .back ol{margin:0;padding:0;list-style:none}

  .cap{font-size:11px;letter-spacing:.06em;text-align:center;line-height:1.5}
  .cap small{display:block;color:var(--muted);font-size:10px}

  /* ---------- CONTROLS ---------- */
  .panel{width:min(92vw,440px);display:flex;flex-direction:column;gap:12px;
    opacity:.35;pointer-events:none;transition:opacity .3s}
  .panel.on{opacity:1;pointer-events:auto}
  .row{display:flex;align-items:center;gap:10px}
  .btns{justify-content:center;gap:8px}
  button{font:inherit;font-size:12px;border:1px solid var(--ink);background:transparent;color:var(--ink);
    height:34px;min-width:44px;padding:0 12px;border-radius:999px;cursor:pointer;letter-spacing:.06em}
  button:hover{background:var(--ink);color:var(--bg)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;background:var(--line);border-radius:2px;flex:1;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
  .time{font-size:10px;color:var(--muted);min-width:34px;font-variant-numeric:tabular-nums}
  .vol{width:110px;flex:none}
  .tracks{list-style:none;margin:4px 0 0;padding:0;font-size:11px;border-top:1px solid var(--line)}
  .tracks li{padding:7px 2px;border-bottom:1px solid var(--line);display:flex;gap:10px;cursor:pointer;color:var(--muted)}
  .tracks li span:first-child{width:20px}
  .tracks li.now{color:var(--ink)}
  .tracks li.now span:first-child::before{content:"▸ ";color:var(--accent)}
  .tracks li:hover{color:var(--ink)}
  @media (max-width:480px){ :root{--cd:124px; --case:140px} .shelf{gap:26px 40px} }
</style>
</head>
<body>

<h1>radio.wip</h1>

<div class="player" id="player">
  <div class="lid-p" id="lid" role="button" aria-label="Play or pause" tabindex="0">
    <div class="hint">drop<br>cd here</div>
    <div class="glyph" id="glyph">❚❚</div>
  </div>
  <div class="brand">cd player</div>
</div>

<div id="status"></div>

<div class="panel" id="panel">
  <div class="row">
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="dur" style="text-align:right">0:00</span>
  </div>
  <div class="row btns">
    <button id="prev" aria-label="Previous">⏮</button>
    <button id="play" aria-label="Play or pause">play</button>
    <button id="next" aria-label="Next">⏭</button>
    <button id="eject" aria-label="Eject">eject ⏏</button>
  </div>
  <div class="row" style="justify-content:center">
    <span class="time" style="min-width:0">vol</span>
    <input class="vol" type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
  </div>
  <ol class="tracks" id="tracks"></ol>
</div>

<div class="shelf" id="shelf"></div>

<script>
/* ============================================================
   EDIT THIS: your mixes.
   src    = full URL to the merged mix file (e.g. your Cloudflare R2 link)
   cover  = image for the front of the jewel case (square works best)
   art    = optional image printed on the disc face itself
            (the case falls back to this if there's no cover; with neither,
             the case gets a plain tinted cover with the title)
   hue    = tints the plain case and recolours the rainbow disc (0-360)
   tracks = optional tracklist with start times in seconds
   ============================================================ */
const MIXES = [
  // PLACEHOLDERS: no src yet, so the CD loads but says "coming soon".
  // When a mix is ready, add a src line, e.g.:
  //   src:"https://pub-xxxx.r2.dev/radio-wip-ep01.mp3",
  //   cover:"https://pub-xxxx.r2.dev/covers/ep01.jpg",
  //   tracks:[ {title:"track one", start:0}, {title:"track two", start:210} ]
  { title:"mix 01", sub:"coming soon", hue:0,   tracks:[] },
  { title:"mix 02",    sub:"coming soon", hue:120, tracks:[] },
];

/* ---------------- setup ---------------- */
const $ = id => document.getElementById(id);
const shelf=$('shelf'), lid=$('lid'), glyph=$('glyph'), statusEl=$('status'), panel=$('panel');
const IDLE='click a case to open it, then drag the cd into the player';
const audio = new Audio(); audio.preload='metadata';
let loaded=null, loadedMix=null;
const items=[];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

MIXES.forEach(m=>{
  const slot=document.createElement('div'); slot.className='slot';
  const img=m.cover||m.art;
  const trackHTML=(m.tracks||[]).slice(0,7).map((t,i)=>`<li>${String(i+1).padStart(2,'0')} ${esc(t.title)}</li>`).join('');
  slot.innerHTML=`
    <div class="anchor"><div class="jewel">
      <div class="tray"></div>
      <div class="lid" role="button" tabindex="0" aria-label="Open or close case: ${esc(m.title)} ${esc(m.sub)}">
        <div class="face front ${img?'':'plain'}" style="--h:${m.hue||0}">
          ${img?'':`<div>${esc(m.title)}<small>${esc(m.sub)}</small></div>`}
          <div class="spine"></div>
        </div>
        <div class="face back"><b>${esc(m.title)} ${esc(m.sub)}</b><ol>${trackHTML}</ol></div>
      </div>
    </div></div>
    <div class="cap">${esc(m.title)}<small>${esc(m.sub)}</small></div>`;
  shelf.appendChild(slot);

  const item={mix:m,slot,open:false,
    anchor:slot.querySelector('.anchor'),jewel:slot.querySelector('.jewel'),
    tray:slot.querySelector('.tray'),lid:slot.querySelector('.lid')};
  if(img) item.lid.querySelector('.front').style.setProperty('--cover',`url("${img}")`);

  const cd=document.createElement('div'); cd.className='cd'; cd.tabIndex=-1;
  cd.setAttribute('aria-label',`CD: ${m.title} ${m.sub||''}. Press Enter to load.`);
  cd.style.setProperty('--hue',(m.hue||0)+'deg');
  if(m.art){ cd.classList.add('has-art'); cd.style.setProperty('--art',`url("${m.art}")`); }
  cd.innerHTML='<div class="disc"></div>';
  cd._item=item; item.cd=cd;
  item.tray.appendChild(cd);
  items.push(item);

  cd.addEventListener('pointerdown',e=>startDrag(e,cd));
  cd.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();loadCD(cd);} });
  item.lid.addEventListener('click',()=> item.open ? setOpen(item,false) : openItem(item));
  item.lid.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); item.lid.click();} });
});

function setOpen(item,v){
  item.open=v;
  item.jewel.classList.toggle('open',v);
  item.slot.classList.toggle('open',v);
  if(item.cd.parentElement===item.tray) item.cd.tabIndex=v?0:-1;
}
function openItem(item){
  items.forEach(o=>{ if(o!==item&&o.open) setOpen(o,false); });
  setOpen(item,true);
  if(!loaded && !drag) setStatus('now drag the cd into the player');
}

/* ---------------- geometry helpers ---------------- */
const size = cd => cd.offsetWidth;
function center(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width}}
function placeAt(cd,cx,cy,scale=1){
  const s=size(cd);
  cd.style.position='fixed'; cd.style.margin='0';
  cd.style.left=(cx-s/2)+'px'; cd.style.top=(cy-s/2)+'px';
  cd.style.transform=`scale(${scale})`;
}
function detach(cd){                    // lift the CD out of its tray so it can move freely
  if(cd.parentElement===document.body) return;
  const c=center(cd);
  cd.classList.remove('glide');
  document.body.appendChild(cd);
  cd.tabIndex=0;
  placeAt(cd,c.x,c.y,1);
}
function overLid(cd){
  const c=center(cd), l=center(lid);
  return Math.hypot(c.x-l.x,c.y-l.y) < l.w*0.75;
}

/* ---------------- drag ---------------- */
let drag=null;
function startDrag(e,cd){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  clearTimeout(cd._t);
  if(cd===loaded) stopPlayback(true);
  const c=center(cd);
  cd.classList.remove('glide','spinning','paused','loaded');
  detach(cd);
  placeAt(cd,c.x,c.y,1);
  cd.classList.add('dragging');
  drag={cd,id:e.pointerId,dx:e.clientX-c.x,dy:e.clientY-c.y,moved:false,sx:e.clientX,sy:e.clientY};
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id) return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4) drag.moved=true;
  placeAt(drag.cd,e.clientX-drag.dx,e.clientY-drag.dy,1);
  lid.classList.toggle('hot',overLid(drag.cd));
}
function onUp(e){
  if(!drag||e.pointerId!==drag.id) return;
  const cd=drag.cd, moved=drag.moved;
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  cd.classList.remove('dragging'); lid.classList.remove('hot');
  const hit=overLid(cd);
  drag=null;
  if(hit || !moved){ loadCD(cd); }
  else { goHome(cd); setStatus(IDLE); }
}

/* ---------------- load / eject ---------------- */
function loadCD(cd){
  if(loaded && loaded!==cd) ejectCD();
  const item=cd._item, l=center(lid), s=size(cd);
  loaded=cd; loadedMix=item.mix;
  clearTimeout(cd._t);
  detach(cd);
  cd.offsetWidth;
  cd.classList.add('glide','loaded');
  placeAt(cd,l.x,l.y,l.w/s*0.98);
  cd._t=setTimeout(()=>{ cd.classList.remove('glide'); cd.classList.add('spinning'); },520);
  setOpen(item,false);                  // empty case snaps shut
  lid.classList.add('has'); panel.classList.add('on');
  buildTracks(loadedMix);
  if(loadedMix.src){
    audio.src=loadedMix.src;
    audio.play().catch(()=>{});
    setStatus('loading…');
  } else {
    setStatus('this mix is coming soon');
  }
}
function ejectCD(){
  if(!loaded) return;
  const cd=loaded;
  stopPlayback(true);
  cd.classList.remove('spinning','paused','loaded');
  goHome(cd);
}
function stopPlayback(clearUI){
  audio.pause(); audio.removeAttribute('src'); audio.load();
  loaded=null; loadedMix=null;
  lid.classList.remove('has'); panel.classList.remove('on');
  glyph.textContent='❚❚';
  $('play').textContent='play'; $('seek').value=0; $('cur').textContent='0:00'; $('dur').textContent='0:00';
  $('tracks').innerHTML='';
  if(clearUI) setStatus(IDLE);
}
function goHome(cd){                    // fly back to its own tray; the case opens to receive it
  const item=cd._item;
  detach(cd);
  openItem(item);
  setStatus(IDLE);
  const r=item.anchor.getBoundingClientRect();           // un-shifted box; open case is shifted right by half its width
  const tx=r.left+r.width, ty=r.top+r.height/2;
  cd.offsetWidth;
  cd.classList.add('glide');
  placeAt(cd,tx,ty,1);
  clearTimeout(cd._t);
  cd._t=setTimeout(()=>{
    cd.classList.remove('glide');
    cd.style.cssText='';
    item.tray.appendChild(cd);
    cd.tabIndex=item.open?0:-1;
  },540);
}
function reseat(){ if(!loaded) return; const l=center(lid); placeAt(loaded,l.x,l.y,l.w/size(loaded)*0.98); }
window.addEventListener('resize',reseat);
window.addEventListener('scroll',reseat,{passive:true});

/* ---------------- audio UI ---------------- */
const fmt=t=>{ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); };
function setStatus(t){ statusEl.textContent=t; }
function togglePlay(){ if(!loaded) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
function buildTracks(m){
  const ol=$('tracks'); ol.innerHTML='';
  (m.tracks||[]).forEach((t,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><span>${esc(t.title)}</span>`;
    li.onclick=()=>{ audio.currentTime=t.start; audio.play().catch(()=>{}); };
    ol.appendChild(li);
  });
}
function trackIndex(){
  const tr=loadedMix&&loadedMix.tracks||[]; let idx=-1;
  tr.forEach((t,i)=>{ if(audio.currentTime>=t.start) idx=i; }); return idx;
}
audio.addEventListener('play',()=>{
  if(!loaded) return;
  loaded.classList.remove('paused'); glyph.textContent='❚❚'; $('play').textContent='pause';
});
audio.addEventListener('pause',()=>{
  if(!loaded) return;
  loaded.classList.add('paused'); glyph.textContent='▶'; $('play').textContent='play';
});
audio.addEventListener('playing',()=>{ if(loadedMix) setStatus('now playing: '+loadedMix.title+(loadedMix.sub?' '+loadedMix.sub:'')); });
audio.addEventListener('waiting',()=>{ if(loadedMix) setStatus('buffering…'); });
audio.addEventListener('error',()=>{ if(loadedMix) setStatus("can't load audio — check the src URL for this mix"); });
audio.addEventListener('loadedmetadata',()=>{ $('dur').textContent=fmt(audio.duration); });
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  $('seek').value=audio.currentTime/audio.duration*1000;
  $('cur').textContent=fmt(audio.currentTime);
  const idx=trackIndex();
  [...$('tracks').children].forEach((li,i)=>li.classList.toggle('now',i===idx));
});
audio.addEventListener('ended',()=>{ if(loaded){ loaded.classList.add('paused'); glyph.textContent='▶'; $('play').textContent='play'; setStatus('end of mix — press eject or play again'); } });

$('seek').addEventListener('input',e=>{ if(audio.duration) audio.currentTime=e.target.value/1000*audio.duration; });
$('vol').addEventListener('input',e=>{ audio.volume=e.target.value/100; });
audio.volume=.8;
$('play').onclick=togglePlay;
$('eject').onclick=ejectCD;
lid.addEventListener('click',togglePlay);
lid.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();togglePlay();} });
$('next').onclick=()=>{
  const tr=loadedMix&&loadedMix.tracks||[]; const i=trackIndex();
  if(tr[i+1]) audio.currentTime=tr[i+1].start; else audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);
};
$('prev').onclick=()=>{
  const tr=loadedMix&&loadedMix.tracks||[]; const i=trackIndex();
  if(tr.length){ audio.currentTime = (audio.currentTime-tr[Math.max(i,0)].start>3) ? tr[Math.max(i,0)].start : (tr[i-1]?tr[i-1].start:0); }
  else audio.currentTime=Math.max(0,audio.currentTime-15);
};
setStatus(IDLE);
</script>
</body>
</html>
